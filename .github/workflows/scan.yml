name: Public demo accessibility scan
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run a11y:public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-lens-scan
          path: paper/evidence/a11y-scan/
