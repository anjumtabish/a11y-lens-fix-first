name: Public demo accessibility scan
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run a11y:public
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: a11y-lens-scan
          path: paper/evidence/a11y-scan/
